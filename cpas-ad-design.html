<title>MOCHA CPAS Ad</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&family=Noto+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap">

<style>
  :root {
    --deep: #0F3B6B;
    --blue: #1A5A9E;
    --mid: #3B7DD8;
    --light: #8BB8E8;
    --pale: #C5D8EE;
    --bg-a: #E2E8F2;
    --bg-b: #EEF1F7;
    --txt: #1A1D2E;
    --txt2: #3A4055;
    --grey: #6B7280;
    --white: #FFFFFF;
    --teal: #1D8B72;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg-a: #E2E8F2;
      --bg-b: #EEF1F7;
    }
  }
  :root[data-theme="dark"] {
    --bg-a: #E2E8F2;
    --bg-b: #EEF1F7;
  }

  body {
    margin: 0;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    background: #D8DCE4;
    font-family: 'Noto Sans', system-ui, sans-serif;
  }

  .canvas {
    container-type: inline-size;
    width: min(calc(100vw - 1.5rem), calc(100vh - 1.5rem), 1080px);
    aspect-ratio: 1;
    position: relative;
    overflow: hidden;
    background: linear-gradient(145deg, var(--bg-a) 0%, var(--bg-b) 55%, #F2F4F9 100%);
    box-shadow: 0 8px 40px rgba(15,59,107,0.12);
  }

  /* ── Decorative blobs ── */
  .deco {
    position: absolute;
    border-radius: 50%;
    pointer-events: none;
  }
  .deco-1 {
    width: 38cqw; height: 38cqw;
    top: -10cqw; left: -12cqw;
    background: radial-gradient(circle, rgba(26,90,158,0.06) 0%, transparent 70%);
  }
  .deco-2 {
    width: 30cqw; height: 30cqw;
    bottom: -8cqw; right: -6cqw;
    background: radial-gradient(circle, rgba(59,125,216,0.07) 0%, transparent 70%);
  }
  .deco-3 {
    width: 18cqw; height: 18cqw;
    top: 42cqw; right: 10cqw;
    background: radial-gradient(circle, rgba(139,184,232,0.08) 0%, transparent 70%);
  }

  /* Subtle molecular dots like Image 2/3 */
  .dot {
    position: absolute;
    border-radius: 50%;
    background: rgba(26,90,158,0.06);
    pointer-events: none;
  }
  .dot-1 { width: 3.5cqw; height: 3.5cqw; top: 18cqw; left: 42cqw; }
  .dot-2 { width: 2cqw; height: 2cqw; top: 22cqw; left: 46cqw; }
  .dot-3 { width: 4cqw; height: 4cqw; bottom: 20cqw; right: 42cqw; }
  .dot-4 { width: 2.5cqw; height: 2.5cqw; bottom: 16cqw; right: 38cqw; }
  .dot-5 { width: 1.8cqw; height: 1.8cqw; top: 48cqw; left: 8cqw; }

  /* ── Deal sections ── */
  .deal {
    position: absolute;
    display: flex;
    align-items: flex-start;
  }

  .deal-01 {
    top: 7cqw;
    left: 3cqw;
    right: 3cqw;
    height: 42cqw;
  }

  .deal-02 {
    bottom: 3cqw;
    left: 3cqw;
    right: 3cqw;
    height: 44cqw;
  }

  /* ── Product areas ── */
  .products-01 {
    position: relative;
    width: 46cqw;
    height: 100%;
    flex-shrink: 0;
  }

  .products-02 {
    position: relative;
    width: 50cqw;
    height: 100%;
    flex-shrink: 0;
    margin-left: auto;
  }

  .product-svg {
    position: absolute;
    filter: drop-shadow(0 4px 12px rgba(15,59,107,0.12));
  }

  /* ── Deal info blocks ── */
  .info {
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 1cqw 2cqw;
  }

  .info-01 {
    margin-left: auto;
    text-align: left;
    padding-top: 3cqw;
  }

  .info-02 {
    text-align: left;
    padding-top: 2cqw;
  }

  /* ── MUA label ── */
  .mua-label {
    font-family: 'Montserrat', sans-serif;
    color: var(--txt);
    line-height: 1.1;
    margin-bottom: 1.2cqw;
  }
  .mua-label .mua-text {
    font-size: 3.2cqw;
    font-weight: 700;
    letter-spacing: 0.05em;
  }
  .mua-label .mua-num {
    font-size: 5.5cqw;
    font-weight: 900;
    color: var(--deep);
    margin-left: 0.5cqw;
  }

  /* ── Product name ── */
  .product-name {
    font-family: 'Noto Sans', sans-serif;
    font-size: 2.6cqw;
    font-weight: 600;
    color: var(--txt);
    line-height: 1.35;
    margin-bottom: 1.8cqw;
  }
  .product-name strong {
    font-weight: 700;
  }

  /* ── Pricing ── */
  .pricing {
    display: flex;
    align-items: center;
    gap: 1.2cqw;
    margin-bottom: 2cqw;
    flex-wrap: wrap;
  }
  .price-old {
    font-family: 'Montserrat', sans-serif;
    font-size: 2.2cqw;
    font-weight: 600;
    color: var(--grey);
    text-decoration: line-through;
    text-decoration-thickness: 1.5px;
    background: rgba(107,114,128,0.08);
    padding: 0.4cqw 1cqw;
    border-radius: 0.4cqw;
  }
  .price-new {
    font-family: 'Montserrat', sans-serif;
    font-size: 2.6cqw;
    font-weight: 800;
    color: var(--white);
    background: var(--blue);
    padding: 0.5cqw 1.2cqw;
    border-radius: 0.5cqw;
  }

  /* ── Gift section ── */
  .gift-section {
    margin-top: 0.5cqw;
  }
  .gift-label {
    font-family: 'Montserrat', sans-serif;
    font-size: 2.2cqw;
    font-weight: 700;
    color: var(--deep);
    margin-bottom: 0.6cqw;
  }
  .gift-label .gift-num {
    font-size: 3.2cqw;
    font-weight: 900;
    color: var(--deep);
    margin-left: 0.3cqw;
  }
  .gift-item {
    font-family: 'Noto Sans', sans-serif;
    font-size: 2cqw;
    font-weight: 500;
    color: var(--txt2);
    line-height: 1.5;
  }

  /* ── Gift badges (circular) ── */
  .badge {
    position: absolute;
    border-radius: 50%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 10;
    box-shadow: 0 3px 16px rgba(15,59,107,0.2);
  }
  .badge-01 {
    width: 13cqw;
    height: 13cqw;
    top: 6cqw;
    left: 29cqw;
    background: linear-gradient(135deg, var(--blue) 0%, var(--mid) 100%);
  }
  .badge-02 {
    width: 13cqw;
    height: 13cqw;
    bottom: 14cqw;
    right: 44cqw;
    background: linear-gradient(135deg, var(--blue) 0%, var(--mid) 100%);
  }
  .badge-text {
    font-family: 'Montserrat', sans-serif;
    font-size: 1.8cqw;
    font-weight: 700;
    color: var(--white);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    line-height: 1;
  }
  .badge-value {
    font-family: 'Montserrat', sans-serif;
    font-size: 3.2cqw;
    font-weight: 900;
    color: var(--white);
    line-height: 1;
    margin-top: 0.2cqw;
  }

  /* ── Divider ── */
  .divider {
    position: absolute;
    left: 8cqw;
    right: 8cqw;
    top: 50%;
    height: 1px;
    background: linear-gradient(90deg, transparent 0%, rgba(26,90,158,0.12) 20%, rgba(26,90,158,0.12) 80%, transparent 100%);
  }

  /* ── SVG text styling ── */
  .svg-brand {
    font-family: 'Montserrat', sans-serif;
    font-weight: 800;
    letter-spacing: 0.08em;
  }
  .svg-label {
    font-family: 'Noto Sans', sans-serif;
    font-weight: 600;
  }
  .svg-sub {
    font-family: 'Noto Sans', sans-serif;
    font-weight: 400;
  }

  /* ── Brand header ── */
  .brand-header {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 5.5cqw;
    background: linear-gradient(90deg, var(--deep) 0%, var(--blue) 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 2cqw;
    z-index: 5;
  }
  .brand-name {
    font-family: 'Montserrat', sans-serif;
    font-size: 2.4cqw;
    font-weight: 900;
    color: var(--white);
    letter-spacing: 0.18em;
  }
  .brand-sep {
    width: 1px;
    height: 2.4cqw;
    background: rgba(255,255,255,0.35);
  }
  .brand-tagline {
    font-family: 'Noto Sans', sans-serif;
    font-size: 1.1cqw;
    font-weight: 500;
    color: rgba(255,255,255,0.85);
    letter-spacing: 0.04em;
  }
</style>
